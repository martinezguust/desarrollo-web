spring.application.name=jurismagna
server.port=8081

# La IP de MySQL (Windows) nunca va fija: se toma de las variables de entorno
# serverTimezone usa la hora de México para que las horas no se corran 6 horas
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/jurismagna?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Mexico_City&connectTimeout=5000&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:listi}
spring.datasource.password=${DB_PASS:123}

# Hibernate crea y actualiza las tablas; después se cargan los datos de data.sql
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Muestra el mensaje de error en la respuesta JSON (400, 401, 404, 409)
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never
