# =====================================================================
# Configuración solo para las pruebas unitarias (./mvnw test)
#
# Usa una base de datos H2 en memoria en lugar de MySQL: las pruebas no
# necesitan MySQL encendido y no tocan los datos de jurismagna.
# Las tablas se crean al iniciar cada prueba y se borran al terminar.
# data.sql no se carga: cada prueba prepara sus propios datos.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:jurismagna;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

spring.web.error.include-message=always
