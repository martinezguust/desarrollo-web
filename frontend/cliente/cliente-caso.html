<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Juris Magna — Mi Caso</title>
    <link rel="stylesheet" href="../css/estilos.css"/>
</head>

<body>

<div id="screen-cliente" class="screen active">
    <div class="iphone">
        <div class="iphone-notch"></div>
        <div class="mobile-screen">

            <!-- Inicio: mi caso -->
            <div id="mob-home" class="mobile-page" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
                <div class="mob-hdr" style="flex-shrink:0">
                    <div class="mob-topbar">
                        <div>
                            <p class="mob-greeting">Bienvenido,</p>
                            <h2 class="mob-name" id="mob-nombre">Cliente</h2>
                        </div>
                        <div class="mob-avatar" id="mob-inicial">C</div>
                    </div>
                </div>
                <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px">
                    <!-- Indicadores -->
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
                        <div style="background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(39,174,96,.2);border-radius:14px;padding:11px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 10px rgba(0,0,0,.06)">
                            <span id="mob-avance" style="color:#27AE60;font-size:17px;font-weight:800;display:block">0%</span>
                            <span style="color:var(--body);font-size:10px">Avance</span>
                        </div>
                        <div style="background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(41,128,185,.2);border-radius:14px;padding:11px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 10px rgba(0,0,0,.06)">
                            <span id="mob-estado" style="color:#2980B9;font-size:13px;font-weight:700;display:block">Activo</span>
                            <span style="color:var(--body);font-size:10px">Estado</span>
                        </div>
                        <div style="background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(212,175,55,.2);border-radius:14px;padding:11px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 10px rgba(0,0,0,.06)">
                            <span id="mob-hon" style="color:var(--gold-dark);font-size:11px;font-weight:800;display:block">$0</span>
                            <span style="color:var(--body);font-size:10px">Honorarios</span>
                        </div>
                    </div>

                    <!-- Mi caso con el anillo de avance -->
                    <div class="caso-card glass" style="padding:14px">
                        <h3 style="font-size:15px;margin-bottom:4px">Mi Caso</h3>
                        <p id="mob-desc" style="font-size:12px;color:var(--body);margin-bottom:8px">—</p>
                        <div style="display:flex;justify-content:center;margin:4px 0 8px">
                            <div style="position:relative;width:140px;height:140px">
                                <svg width="140" height="140" viewBox="0 0 140 140">
                                    <circle cx="70" cy="70" r="56" fill="none" stroke="#E5E7EB" stroke-width="16"/>
                                    <circle cx="70" cy="70" r="56" fill="none" id="mob-ring-arc"
                                        stroke="#27AE60" stroke-width="16" stroke-linecap="round"
                                        stroke-dasharray="351.86" stroke-dashoffset="351.86"
                                        transform="rotate(-90 70 70)"
                                        style="transition:stroke-dashoffset 0.9s cubic-bezier(.4,0,.2,1),stroke 0.4s ease"/>
                                </svg>
                                <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
                                    <span id="mob-chart-pct" style="font-size:28px;font-weight:800;color:var(--dark);line-height:1">0%</span>
                                    <span style="font-size:10px;color:var(--body);margin-top:2px">Avance</span>
                                </div>
                            </div>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px">
                            <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--body)"><div style="width:8px;height:8px;border-radius:50%;background:#27AE60"></div>Completado</div>
                            <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--body)"><div style="width:8px;height:8px;border-radius:50%;background:#F39C12"></div>En Proceso</div>
                            <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--body)"><div style="width:8px;height:8px;border-radius:50%;background:#C0392B"></div>Cancelado</div>
                            <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--body)"><div style="width:8px;height:8px;border-radius:50%;background:#E5E7EB"></div>Pendiente</div>
                        </div>
                        <div onclick="verPerfilAbogadoCliente()" style="font-size:12px;font-weight:600;color:var(--gold-dark);cursor:pointer;display:flex;align-items:center;gap:5px">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                            <span id="mob-abogado">—</span>
                            <span style="font-size:10px;opacity:.6">→ ver perfil</span>
                        </div>
                    </div>

                    <!-- Comentario del abogado con voz -->
                    <button id="mob-audio-btn" onclick="escucharComentario()" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;background:rgba(41,128,185,.08);border:1px solid rgba(41,128,185,.2);border-radius:14px;font-weight:600;font-size:12px;color:var(--blue);width:100%;cursor:pointer">
                        🔊 Escuchar comentarios de mi abogado
                    </button>
                    <div id="mob-comments-box" style="background:#fff;border:1px solid var(--gb);border-radius:14px;padding:12px;font-size:12px;color:var(--dark);line-height:1.6"></div>

                    <!-- Documentos en Drive: solo aparece si el abogado puso el enlace -->
                    <a id="mob-drive-btn" href="#" target="_blank" style="display:none;align-items:center;justify-content:center;gap:10px;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));border-radius:14px;font-weight:700;font-size:13px;color:var(--dark);text-decoration:none;box-shadow:0 4px 14px rgba(212,175,55,.35);min-height:52px">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                        Ver mis documentos en Drive
                    </a>
                </div>
            </div>

            <nav class="mob-navbar" style="flex-shrink:0">
                <a class="mob-nav-btn active" href="cliente-caso.html">
                    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                    <span>Inicio</span>
                </a>
                <a class="mob-nav-btn" href="cliente-perfil.html">
                    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
                    <span>Perfil</span>
                </a>
                <a class="mob-nav-btn" href="cliente-chat.html">
                    <span style="position:relative">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <span id="mob-chat-badge" style="display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#C0392B;border:1.5px solid var(--bg)"></span>
                    </span>
                    <span>Chat</span>
                </a>
                <button class="mob-nav-btn" onclick="cerrarSesion()">
                    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg></span>
                    <span>Salir</span>
                </button>
            </nav>
            <div class="iphone-bar"></div>
        </div>
    </div>
</div>

<script src="../js/compartidos/sesion.js"></script>
<script src="../js/compartidos/utilidades.js"></script>
<script src="../js/compartidos/api.js"></script>
<script src="../js/compartidos/chat.js"></script>
<script src="../js/cliente/cliente-caso.js"></script>

</body>
</html>
