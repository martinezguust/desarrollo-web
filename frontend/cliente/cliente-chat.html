<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Juris Magna — Chat</title>
    <link rel="stylesheet" href="../css/estilos.css"/>
</head>

<body>

<div id="screen-cliente" class="screen active">
    <div class="iphone">
        <div class="iphone-notch"></div>
        <div class="mobile-screen">

            <!-- Chat con mi abogado -->
            <div id="mob-chat" class="mobile-page" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
                <div style="padding:44px 16px 12px;border-bottom:1px solid var(--gb);display:flex;align-items:center;gap:8px;flex-shrink:0">
                    <h2 style="font-size:18px;flex:1">Chat</h2>
                    <span style="color:var(--green);font-size:12px">●</span>
                </div>
                <div id="chat-msgs" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px"></div>
                <div style="padding:8px 12px 6px;border-top:1px solid var(--gb);display:flex;align-items:center;gap:6px;background:var(--bg);flex-shrink:0">
                    <button id="mob-audio-rec-btn" onclick="grabarAudioCliente()" title="Grabar audio" style="padding:7px 8px;border-radius:8px;border:1px solid var(--gb);background:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;flex-shrink:0;transition:color .2s">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    </button>
                    <button onclick="adjuntarArchivoCliente()" style="padding:7px 8px;border-radius:8px;border:1px solid var(--gb);background:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;flex-shrink:0">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <div style="flex:1;display:flex;background:#fff;border:1px solid var(--gb);border-radius:50px;overflow:hidden;align-items:center;padding-right:4px">
                        <input id="chat-input" placeholder="Mensaje..." onkeydown="if (event.key === 'Enter') enviarMensajeCliente()" style="flex:1;padding:8px 12px;border:none;outline:none;font-size:13px;background:transparent;font-family:inherit"/>
                        <button onclick="enviarMensajeCliente()" style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-dark));display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dark);cursor:pointer;border:none">➤</button>
                    </div>
                </div>
            </div>

            <nav class="mob-navbar" style="flex-shrink:0">
                <a class="mob-nav-btn" href="cliente-caso.html">
                    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
                    <span>Inicio</span>
                </a>
                <a class="mob-nav-btn" href="cliente-perfil.html">
                    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
                    <span>Perfil</span>
                </a>
                <a class="mob-nav-btn active" href="cliente-chat.html">
                    <span style="position:relative">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <span id="mob-chat-badge" style="display:none;position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#C0392B;border:1.5px solid var(--bg)"></span>
                    </span>
                    <span>Chat</span>
                </a>
                <button class="mob-nav-btn" onclick="cerrarSesion()">
                    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4m7 14 5-5-5-5m5 5H9"/></svg></span>
                    <span>Salir</span>
                </button>
            </nav>
            <div class="iphone-bar"></div>
        </div>
    </div>
</div>

<script src="../js/compartidos/sesion.js"></script>
<script src="../js/compartidos/utilidades.js"></script>
<script src="../js/compartidos/api.js"></script>
<script src="../js/compartidos/chat.js"></script>
<script src="../js/cliente/cliente-chat.js"></script>

</body>
</html>
