<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>Juris Magna</title>
    <link rel="stylesheet" href="css/estilos.css"/>
</head>

<body>

<div id="screen-login" class="screen active">
    <div class="login-card">
        <!-- Logo y título -->
        <div class="login-logo-inner">
            <img src="img/logo.jpg" alt="Logo Juris Magna"/>
            <h1>Juris Magna</h1>
            <div class="tag-line"><span>Firma de Abogados, Justicia y Ley</span></div>
        </div>

        <!-- Roles -->
        <div class="login-section-label">Acceder como</div>
        <div class="role-selector">
            <button class="role-btn active" onclick="seleccionarRol('ADMIN', this)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Administrador</span>
            </button>
            <button class="role-btn" onclick="seleccionarRol('ABOGADO', this)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><path d="M5 6l7-3 7 3"/><path d="M4 10l-1.5 6h3L4 10z"/><path d="M20 10l-1.5 6h3L20 10z"/></svg>
                <span>Abogado</span>
            </button>
            <button class="role-btn" onclick="seleccionarRol('CLIENTE', this)">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <span>Cliente</span>
            </button>
        </div>

        <!-- Usuario -->
        <div class="login-input-pill">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            <input id="login-user" type="text" placeholder="Usuario" oninput="revisarLogin()"/>
        </div>

        <!-- Contraseña -->
        <div class="login-input-pill" style="position:relative">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="login-pass" type="password" placeholder="Contraseña" onkeydown="if (event.key === 'Enter') iniciarSesion()" oninput="revisarLogin()" style="padding-right:40px"/>
            <button type="button" onclick="alternarPassword('login-pass')" tabindex="-1" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#C0C7D0;display:flex;align-items:center;padding:4px;transition:color .2s" onmouseover="this.style.color='var(--gold-dark)'" onmouseout="this.style.color='#C0C7D0'">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>

        <div id="login-error" class="error-msg" style="display:none"></div>
        <button class="login-submit" onclick="iniciarSesion()">Iniciar Sesión &nbsp;›</button>

        <div class="login-hint">
            <p>Admin: admin / admin123 &nbsp;·&nbsp; Abogado: jramirez / abogado123</p>
            <p>Cliente: cvega / cliente123</p>
        </div>
    </div>
    <div class="login-footer">© 2026 Juris Magna · Todos los derechos reservados</div>
</div>

<script src="js/compartidos/sesion.js"></script>
<script src="js/compartidos/utilidades.js"></script>
<script src="js/compartidos/api.js"></script>
<script src="js/login.js"></script>

</body>
</html>
