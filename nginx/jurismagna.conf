# =====================================================================
# Juris Magna — configuración de nginx
#
# - En "/" sirve el frontend (HTML, CSS y JS).
# - En "/api/" pasa las peticiones a Spring Boot (puerto 8081). La "/"
#   al final de proxy_pass quita el /api: /api/clientes -> /clientes.
# - En "/uploads/" entrega los archivos subidos (fotos, audios, archivos).
#
# Cambia USUARIO por tu usuario de WSL (el README explica cómo).
# Como todo sale de http://localhost, no hace falta configurar CORS.
# =====================================================================

server {
    listen 80;

    # Las fotos, audios y archivos pueden pesar hasta 10 MB (igual que Spring)
    client_max_body_size 10M;

    location / {
        root /home/USUARIO/desarrollo-web/frontend;
        index index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8081/uploads/;
    }
}
